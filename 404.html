<script>
// Old links (e.g. /commercial/ with a slash, or old-site URLs) land here. Send visitors to the right page
// immediately and keep the screen blank meanwhile, so nobody sees a "moved" message or waits.
(function(){
  var p=location.pathname.toLowerCase().replace(/\/+$/,"")||"/";
  var pages={"/about":1,"/services":1,"/ground-mount":1,"/residential":1,"/housing-society":1,"/commercial":1,"/operations-maintenance":1,"/clients":1,"/contact":1,"/zam-steel":1};

  var t=pages[p]?p:null;
  if(!t){for(var i=0;i<map.length;i++){if(p.indexOf(map[i][0])>-1){t=map[i][1];break}}}
  if(t&&t!==location.pathname){document.documentElement.style.visibility="hidden";location.replace(t+location.search+location.hash);return}
  // nothing matched: show a small page and go home
  window.addEventListener("DOMContentLoaded",function(){setTimeout(function(){location.replace("/")},2500)});
})();
</script>
